<head>

    <!-- 파비콘 세트 (/favicon 폴더에 업로드) -->
    <link rel="icon" type="image/png" sizes="32x32" href="asset/img/favicon-32.png?v=20260812-r4" />
    <link rel="apple-touch-icon" sizes="180x180" href="asset/img/apple-touch-icon-180.png?v=20260812-r4" />

    <!-- 오픈그래프 (카카오톡/페이스북 등 공유 미리보기) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="kooksoondang" />
    <meta property="og:title" content="Kooksoondang | 막걸리의 새로운 경험" />
    <meta property="og:description" content="Kooksoondang의 막걸리와 새로운 주류 경험을 만나보세요." />
    <meta property="og:url" content="https://jin0484.github.io/kooksoondang/" />
    <meta property="og:image" content="https://jin0484.github.io/kooksoondang/asset/img/og.png?v=20260812" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="Kooksoondang official website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Kooksoondang | 막걸리의 새로운 경험</title>
    <link rel="stylesheet" href="common/reset.css">
    <!-- 페이지 전환 덮개. 첫 프레임부터 덮여 있어야 하므로 다른 스타일보다 먼저 읽어 둠 -->
    <link rel="stylesheet" href="common/page_transition.css">
    <link rel="stylesheet" href="index.css">
    <script src="common/page_transition.js" defer></script>
    <script src="index.js" defer></script>
</head>

<body>
    <!--
        19세 인증. 페이지를 열면 바로 보임.
        data-pass = YES 를 눌렀을 때 갈 곳
    -->
    <section class="age_gate" id="age_gate" data-pass="test/test.html">
        <div class="age_gate_curve" aria-hidden="true"></div>

        <div class="age_gate_inner">
            <!-- 질문 화면 -->
            <div class="age_gate_view" data-view="ask">
                <h1 class="age_gate_title">Are you of legal drinking age?</h1>
                <div class="age_gate_actions">
                    <button type="button" class="age_gate_btn" data-answer="yes">YES</button>
                    <button type="button" class="age_gate_btn" data-answer="no">NO</button>
                </div>
            </div>

            <!-- NO 를 눌렀을 때. 글은 왼쪽에 몰아 두고 오른쪽에 캐릭터를 세움 -->
            <div class="age_gate_view age_gate_deny" data-view="deny" hidden>
                <div class="age_gate_deny_text">
                    <h1 class="age_gate_title">Please come back later</h1>
                    <p class="age_gate_desc">
                        You must be 19 or older to enter.<br>
                        See you next time!
                    </p>
                    <button type="button" class="age_gate_back" data-answer="back">Choose again</button>
                </div>

                <!-- 파일 이름에 띄어쓰기가 있어 %20 으로 적어 둠 -->
                <img class="age_gate_deny_character" src="test/test_asset/주먹쥔_화난%201.png"
                    data-frames="test/test_asset/주먹쥔_화난%201.png,test/test_asset/주먹쥔_화난%202.png"
                    data-frame-ms="300" alt="" aria-hidden="true">
            </div>
        </div>

        <img class="age_gate_logo" src="asset/logo/logo.svg" alt="kooksoondang">
    </section>
</body>

</html>
